<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Long task demo</title><link rel="stylesheet" href="/style.css"><main><h1>能接着完成的任务</h1><p>独立的虚构长任务示例。生成器只返回本机样例，不调用模型、不联网。</p><label>示例主题<input id="topic" value="社区花园 / Community garden" maxlength="2000"></label><button id="create">创建示例任务</button><button id="retry" disabled>从保存失败处继续</button><p id="status" role="status"></p><pre id="result"></pre><p>首次保存会故意失败。点击继续后复用已生成内容；刷新页面可找回任务。示例数据保存在本机 .state，关闭服务后可重新打开。</p></main><script src="/app.js"></script></html>
